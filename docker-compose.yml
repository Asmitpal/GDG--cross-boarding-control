version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crossboarding_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossboarding
      POSTGRES_PASSWORD: crossboarding_secret
      POSTGRES_DB: crossboarding
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crossboarding']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crossboarding_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: crossboarding_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crossboarding:crossboarding_secret@postgres:5432/crossboarding
      REDIS_URL: redis://redis:6379
      PORT: 3001
      API_KEY: dev-secret-key-change-in-prod
      SLACK_WEBHOOK_URL: ''
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/backend/src:/app/src
    command: npm run dev

volumes:
  pg_data:
  redis_data:
